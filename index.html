<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>සංවේදක තත්ත්ව දර්ශකය (Sensor Dashboard)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #d5d9f7; text-align: center; padding: 20px; }
        h2 { color: #333; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 18px; }
        .locked { color: #d9534f; font-weight: bold; }
        .unlocked { color: #5cb85c; font-weight: bold; }
        #timestamp { font-size: 14px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>ਸංවේදක 10 ක සජීවී තත්ත්වය (Live Sensor Status)</h2>
    <div class="grid-container" id="sensorGrid">දත්ත ලබා ගනිමින් පවතී...</div>
    <div id="timestamp">අවසන් වරට යාවත්කාලීන වූ වේලාව: -</div>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycby-MjBxa86aCtxhjSzupTTk4pJGzRQLdfUMET914tuOJkqwcUk_TK8Z_Zttu8jttlU-3Q/exec"; // ඉහත පියවරේදී ලැබුණු URL එක මෙහි දමන්න

        function fetchSensorData() {
            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    const grid = document.getElementById('sensorGrid');
                    grid.innerHTML = "";
                    
                    data.forEach(sensor => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        let statusClass = sensor.status.toLowerCase() === 'locked' ? 'locked' : 'unlocked';
                        
                        card.innerHTML = `<strong>${sensor.id}</strong><br><br><span class="${statusClass}">${sensor.status}</span>`;
                        grid.appendChild(card);
                    });

                    document.getElementById('timestamp').innerText = "අවසන් වරට යාවත්කාලීන වූ වේලාව: " + new Date().toLocaleTimeString();
                })
                .catch(error => console.error('දත්ත ලබා ගැනීමේ දෝෂයක්:', error));
        }

        // මුල් වරට දත්ත ලබා ගැනීම
        fetchSensorData();

        // තත්පර 5 කට වරක් (තත්පර 5000 ms) දත්ත ස්වයංක්‍රීයව යාවත්කාලීන කිරීම
        setInterval(fetchSensorData, 2000);
    </script>

</body>
</html>
